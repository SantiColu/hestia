[project]
name = "hestia-mcp"
version = "0.1.0"
description = "Hestia MCP server. A pure HTTP client of the Hestia REST API; never imports backend code."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
]

[project.scripts]
hestia-mcp = "hestia_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hestia_mcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
