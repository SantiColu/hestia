[project]
name = "hestia-mcp"
version = "0.1.0"
description = "Hestia MCP server. A pure HTTP client of the Hestia REST API; never imports backend code."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.2",
    "httpx>=0.27",
]

[project.scripts]
hestia-mcp = "hestia_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Conventions in docs/conventions.md («Python»). Beyond the base set: comprehensions (C4),
# misc. simplifications (PIE, RET, FURB, PERF), pathlib (PTH), no print (T20), no commented-out
# code (ERA), timezone-aware datetimes (DTZ), no blind except (BLE), no shadowed builtins (A),
# no unused arguments (ARG).
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF",
    "C4", "PIE", "RET", "FURB", "PERF", "PTH", "T20", "ERA", "DTZ", "BLE", "A", "ARG",
]

[tool.ruff.lint.isort]
known-first-party = ["hestia_mcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
