[project]
name = "hestia-backend"
version = "0.1.0"
description = "Hestia backend workspace root (not a package)."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "hestia-core",
    "hestia-project",
    "hestia-adapters",
    "hestia-api",
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "skyfield>=1.55",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
hestia-core = { workspace = true }
hestia-project = { workspace = true }
hestia-adapters = { workspace = true }
hestia-api = { workspace = true }

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = ["--import-mode=importlib", "-ra"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hestia_core", "hestia_project", "hestia_adapters", "hestia_api"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "apps", "tests"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["hestia_core", "hestia_project", "hestia_adapters", "hestia_api"]
# External packages are needed for the "no AI" contract below (ADR 0015).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "hestia_core is independent of every other Hestia package"
type = "forbidden"
source_modules = ["hestia_core"]
forbidden_modules = ["hestia_project", "hestia_adapters", "hestia_api"]

[[tool.importlinter.contracts]]
name = "hestia_adapters depends only on hestia_core"
type = "forbidden"
source_modules = ["hestia_adapters"]
forbidden_modules = ["hestia_project", "hestia_api"]

[[tool.importlinter.contracts]]
name = "hestia_project never depends on hestia_api or hestia_adapters"
type = "forbidden"
source_modules = ["hestia_project"]
forbidden_modules = ["hestia_api", "hestia_adapters"]

[[tool.importlinter.contracts]]
# Hestia is deterministic and works without AI (ADR 0015). Keep in sync with
# tests/test_no_ai_dependencies.py.
name = "Hestia never imports AI SDKs or frameworks"
type = "forbidden"
source_modules = ["hestia_core", "hestia_project", "hestia_adapters", "hestia_api"]
forbidden_modules = [
    "anthropic",
    "openai",
    "pydantic_ai",
    "logfire",
    "langchain",
    "langchain_core",
    "langchain_community",
    "langchain_openai",
    "langchain_anthropic",
    "llama_index",
    "litellm",
    "transformers",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "hestia_api",
    "hestia_project | hestia_adapters",
    "hestia_core",
]
