[project]
name = "hestia-api"
version = "0.1.0"
description = "Hestia REST API (FastAPI). Single entry point for UI and MCP clients."
requires-python = ">=3.12,<3.13"
dependencies = ["hestia-core", "hestia-project", "hestia-adapters", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia_api"]

[tool.uv.sources]
hestia-core = { workspace = true }
hestia-project = { workspace = true }
hestia-adapters = { workspace = true }
