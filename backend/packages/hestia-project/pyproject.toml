[project]
name = "hestia-project"
version = "0.1.0"
description = "Hestia project model: workflow graph, stage states, provenance and history."
requires-python = ">=3.12,<3.13"
dependencies = ["hestia-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia_project"]

[tool.uv.sources]
hestia-core = { workspace = true }
