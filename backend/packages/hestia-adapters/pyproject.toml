[project]
name = "hestia-adapters"
version = "0.1.0"
description = "Adapters implementing hestia_core Protocols with external tools (Orekit, pyViewFactor, SciPy)."
requires-python = ">=3.12,<3.13"
dependencies = ["hestia-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hestia_adapters"]

[tool.uv.sources]
hestia-core = { workspace = true }
